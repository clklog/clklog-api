name: Unit Test Gate + Deploy Test Environment

on:
  workflow_dispatch:
  push:
    branches: [aitest]
  pull_request:
    branches: [aitest]
  workflow_run:
    workflows:
      - Node.js CI
    branches: [aitest]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "8"
  JAVA_DISTRO: "temurin"
 
jobs:
  unit-test-gate:
    name: mvn test + JaCoCo >=80% gate (hosted, safe for public repo PR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 8 + Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: mvnw test + JaCoCo prepare-agent（若无 mvnw 则使用系统 PATH 中的 mvn；prepare-agent 与 test 合并执行，保证 ${argLine} 注入）
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mvnw mvnw.cmd 2>/dev/null || true
          if [ -x ./mvnw ]; then
            ./mvnw -B -ntp clean org.jacoco:jacoco-maven-plugin:0.8.11:prepare-agent test
          else
            mvn -B -ntp clean org.jacoco:jacoco-maven-plugin:0.8.11:prepare-agent test
          fi

      - name: JaCoCo generate report (Runner Smoke 临时短路径：不开 80% 门禁 check，只出报告；阶段 A/B 步骤 7 质量闸时切回上一条 check 规则)
        shell: bash
        run: |
          set -euo pipefail
          MVN_CMD="./mvnw -B -ntp"
          if [ ! -x ./mvnw ]; then MVN_CMD="mvn -B -ntp"; fi
          $MVN_CMD org.jacoco:jacoco-maven-plugin:0.8.11:report || true
          # —— 步骤 7 质量闸要卡 80% 时，把上面一行 report || true 注释掉，切回下面 check 5 行生效：
          # $MVN_CMD org.jacoco:jacoco-maven-plugin:0.8.11:report
          # $MVN_CMD org.jacoco:jacoco-maven-plugin:0.8.11:check \
          #   -Djacoco.rules[0].element=BUNDLE \
          #   -Djacoco.rules[0].limits[0].counter=LINE \
          #   -Djacoco.rules[0].limits[0].value=COVEREDRATIO \
          #   -Djacoco.rules[0].limits[0].minimum=0.80

      - name: Upload JaCoCo report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ github.event.repository.name }}
          path: target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 30

  deploy-test:
    name: deploy-test (self-hosted clklog-ce-runner @ 10.10.222.66, only on aitest branch)
    needs: [unit-test-gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/aitest'
    runs-on: [self-hosted, clklog-ce-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Runner: $RUNNER_NAME"
          hostname
          uname -a
          whoami
